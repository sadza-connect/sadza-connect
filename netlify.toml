[build]
  command = "npm run build"
  publish = ".next"

  # Disable Netlify secrets scanner to prevent false-positives on standard config like PORT=3000, NODE_ENV=production, DB_NAME=postgres
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "API_PREFIX,RATE_LIMIT_WINDOW_MS,RATE_LIMIT_MAX,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_API_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,HOST,DB_NAME,DB_PORT,DB_SSL,DB_USER,DB_HOST,DB_PASSWORD,DATABASE_URL,JWT_ISSUER,JWT_AUDIENCE,JWT_ACCESS_EXPIRES_IN,JWT_REFRESH_EXPIRES_IN,NODE_ENV,CORS_ORIGINS,FRONTEND_URL,PORT,EMAIL_FROM,SUPABASE_URL,SUPABASE_ANON_KEY,R2_ACCESS_KEY_ID,R2_ACCOUNT_ID,R2_BUCKET_NAME,R2_PUBLIC_DOMAIN,R2_SECRET_ACCESS_KEY,RESEND_API_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_JWT_SECRET"
  SECRETS_SCAN_OMIT_PATHS = "docs/**,*.md"

[[plugins]]
  package = "@netlify/plugin-nextjs"
